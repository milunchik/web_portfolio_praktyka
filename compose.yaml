services:
  api:
    build:
      context: .
      target: api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
      - path: apps/api/.env
        required: false
    environment:
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-prod}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:ritipe45@host.docker.internal:5432/portfolio?schema=public}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - '${PORT:-3001}:3001'
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: apps/web/.env
        required: false
    environment:
      API_URL: ${API_URL:-http://api:3001}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - '${WEB_PORT:-3000}:3000'
    restart: unless-stopped
